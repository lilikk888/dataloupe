name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test suite
        run: python -m unittest discover -s tests -v

      - name: Analyse every example
        shell: bash
        run: |
          for f in examples/*; do
            echo "::group::$f"
            python dataloupe.py "$f" --no-color || true
            echo "::endgroup::"
          done

      - name: Clean data exits 0 and writes a report
        shell: bash
        run: |
          python dataloupe.py examples/sales.csv --no-color -o report.html
          test -s report.html

      - name: Broken data exits 1
        shell: bash
        run: |
          set +e
          python dataloupe.py examples/messy.csv --no-color -o messy.html
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit code 1 for messy.csv, got $code"
            exit 1
          fi

      - name: Report is self-contained
        shell: bash
        run: |
          if grep -qE '(src|href)="https?://' report.html; then
            echo "::error::report references external resources"
            exit 1
          fi
          echo "OK: no external references"

      - name: Emits DDL for every dialect
        shell: bash
        run: |
          for dialect in postgres mysql sqlite; do
            python dataloupe.py examples/sales.csv --no-color --sql "$dialect" > "schema-$dialect.sql"
            grep -q "CREATE TABLE" "schema-$dialect.sql"
            echo "::group::$dialect"
            cat "schema-$dialect.sql"
            echo "::endgroup::"
          done
          echo "OK: three dialects"

      - name: Drift detection runs on a two-file example
        shell: bash
        run: |
          set +e
          python dataloupe.py examples/customers_old.csv examples/customers_new.csv --diff --no-color
          python dataloupe.py examples/customers_old.csv examples/customers_new.csv --diff --json | grep -q '"drift": true'
          echo "OK: diff path exercised"

      - name: Row diff and distribution drift are reported
        shell: bash
        run: |
          python dataloupe.py examples/customers_old.csv examples/customers_new.csv \
            --diff --json > customers.json
          python - <<'EOF'
          import json
          payload = json.load(open("customers.json", encoding="utf-8"))
          rows = payload["row_diff"]
          assert rows["old_only"] == 2, rows
          assert rows["new_only"] == 2, rows
          assert rows["common"] == 3, rows
          print("OK: row diff", rows)
          EOF

          python dataloupe.py examples/orders_march.csv examples/orders_april.csv \
            --diff --json > orders.json
          python - <<'EOF'
          import json
          payload = json.load(open("orders.json", encoding="utf-8"))
          shifted = {s["column"] for s in payload["distribution_shifts"]}
          assert "amount" in shifted, shifted
          assert "shipping_days" in shifted, shifted
          # An auto-increment key must never be reported as a shift.
          assert "order_id" not in shifted, shifted
          print("OK: distribution drift", sorted(shifted))
          EOF

      - name: Drift report is a self-contained HTML file
        shell: bash
        run: |
          set +e
          python dataloupe.py examples/orders_march.csv examples/orders_april.csv \
            --diff -o drift.html --no-color
          set -e
          test -s drift.html
          grep -q "分布漂移" drift.html
          if grep -qE '(src|href)="https?://' drift.html; then
            echo "::error::drift report references external resources"
            exit 1
          fi
          echo "OK: drift.html is standalone"

      - name: Masking redacts and leaves the source alone
        shell: bash
        run: |
          cp examples/users.csv users_copy.csv
          before=$(cksum users_copy.csv)
          python dataloupe.py users_copy.csv --mask -o masked.csv --no-color > /dev/null
          after=$(cksum users_copy.csv)
          if [ "$before" != "$after" ]; then
            echo "::error::--mask modified its input"
            exit 1
          fi
          grep -q 'z\*\*\*@example.com' masked.csv
          grep -q '138\*\*\*\*8000' masked.csv
          grep -q '110101\*\*\*\*\*\*\*\*1234' masked.csv
          if grep -q 'zhangwei@example.com' masked.csv; then
            echo "::error::original email survived masking"
            exit 1
          fi
          echo "OK: masked output is clean"

      - name: Survives a legacy Windows code page
        if: runner.os == 'Windows'
        shell: bash
        run: |
          PYTHONIOENCODING=cp1252 python dataloupe.py examples/sales.csv --no-color > /dev/null
          echo "OK: cp1252 safe"
