name: release

# Publishing is triggered by a tag, never by a branch push, so a normal commit
# can never ship a version by accident.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: The tag must match the version in the code
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(python -c 'import dataloupe; print(dataloupe.__version__)')"
          echo "tag=$tag code=$code"
          if [ "$tag" != "$code" ]; then
            echo "::error::tag $tag does not match dataloupe.__version__ $code"
            exit 1
          fi

      - name: Test suite
        run: python -m unittest discover -s tests -v

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: The wheel installs and runs on its own
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/dataloupe examples/sales.csv --no-color > /dev/null
          echo "OK: installed wheel runs"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so no
    # API token is stored anywhere. Configure the publisher once at
    # https://pypi.org/manage/account/publishing/ with:
    #   owner lilikk888 / repo dataloupe / workflow release.yml / env pypi
    environment:
      name: pypi
      url: https://pypi.org/p/dataloupe
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
