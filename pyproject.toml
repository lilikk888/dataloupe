[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dataloupe"
version = "1.6.0"
description = "Zero-dependency data file profiler and quality gate for CSV, TSV, JSONL, JSON and XLSX."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "lilikk888" }]
keywords = [
    "csv", "data-quality", "data-profiling", "profiling", "cli",
    "excel", "xlsx", "jsonl", "no-dependencies", "data-cleaning",
    "data-validation", "pii", "schema-drift",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/lilikk888/dataloupe"
Repository = "https://github.com/lilikk888/dataloupe"
Changelog = "https://github.com/lilikk888/dataloupe/blob/main/CHANGELOG.md"
Issues = "https://github.com/lilikk888/dataloupe/issues"

[project.scripts]
dataloupe = "dataloupe:main"

[tool.setuptools]
py-modules = ["dataloupe"]
license-files = ["LICENSE"]
